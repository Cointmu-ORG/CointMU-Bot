name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile's base image is the only place the Node version is
      # written (Dependabot bumps it there); both stages must agree.
      - name: Read Node version from Dockerfile
        id: node
        run: |
          versions=$(sed -n 's/^FROM node:\([0-9.]*\)-.*/\1/p' Dockerfile | sort -u)
          if [ -z "$versions" ] || [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "::error file=Dockerfile::FROM lines must share one node:<version> tag"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      # Same as the Dockerfile: better-sqlite3 ships prebuilt binaries, so no
      # install scripts (and no node-gyp toolchain) are needed.
      - run: npm ci --ignore-scripts

      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile's base image is the only place the Node version is
      # written (Dependabot bumps it there); both stages must agree.
      - name: Read Node version from Dockerfile
        id: node
        run: |
          versions=$(sed -n 's/^FROM node:\([0-9.]*\)-.*/\1/p' Dockerfile | sort -u)
          if [ -z "$versions" ] || [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "::error file=Dockerfile::FROM lines must share one node:<version> tag"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile's base image is the only place the Node version is
      # written (Dependabot bumps it there); both stages must agree.
      - name: Read Node version from Dockerfile
        id: node
        run: |
          versions=$(sed -n 's/^FROM node:\([0-9.]*\)-.*/\1/p' Dockerfile | sort -u)
          if [ -z "$versions" ] || [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "::error file=Dockerfile::FROM lines must share one node:<version> tag"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm test

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build only, never pushed: proves the production image still compiles.
      - run: docker build --tag cointmu-bot:ci .

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0

      # Version and sha256 are bumped by hand: Dependabot can't see this
      # download. Take both from the release's gitleaks_<ver>_checksums.txt.
      # (gitleaks-action needs a paid license on organization repos.)
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
