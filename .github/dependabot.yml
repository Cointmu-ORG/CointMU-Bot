version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # One PR for all npm bumps instead of one per dependency.
    groups:
      npm-dependencies:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # typescript-eslint peers typescript <6.1.0, so a typescript 7 bump
      # breaks `npm ci`. Drop this once typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL refuses to run when init and analyze are on different versions,
      # so they have to be bumped in the same PR.
      # One PR for all actions, which also keeps them together.
      actions:
        patterns: ["*"]

  # The Dockerfile's node tag is also the Node version CI runs on.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
