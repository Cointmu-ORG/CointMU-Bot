version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # typescript-eslint peers typescript <6.1.0, so a typescript 7 bump
      # breaks `npm ci`. Drop this once typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL refuses to run when init and analyze are on different versions,
      # so they have to be bumped in the same PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # The Dockerfile's node tag is also the Node version CI runs on.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
