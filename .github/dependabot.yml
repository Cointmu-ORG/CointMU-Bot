version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL refuses to run when init and analyze are on different versions,
      # so they have to be bumped in the same PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # The Dockerfile's node tag is also the Node version CI runs on.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
